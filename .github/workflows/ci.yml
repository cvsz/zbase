name: ci

# Gates run in order of cost: cheap checks first, container-backed suites last.
# A failing gate fails the job. No gate is weakened to make the pipeline green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so the interpreter under test is the interpreter that ships.
  PYTHON_VERSION: '3.14'

jobs:
  baseline:
    name: structure and bootstrap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate repository structure and Markdown links
        run: python3 scripts/validate_repo.py

      - name: Bootstrap behaviour tests
        run: python3 -m unittest discover -s tests -v

      - name: Secret scan
        run: |
          if [ -x .venv/bin/detect-secrets ]; then
            .venv/bin/detect-secrets scan --all-files
          else
            echo "detect-secrets not installed; using grep fallback"
            # A committed .env or PEM private key is a hard failure.
            ! git ls-files | grep -E '(^|/)\.env$|\.pem$|id_rsa' || {
              echo "::error::a secret-shaped file is tracked"; exit 1; }
          fi

  static:
    name: lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Byte-compile every module
        run: .venv/bin/python -m compileall -q apps tests

      - name: Ruff
        run: |
          .venv/bin/pip install ruff==0.9.6
          .venv/bin/ruff check apps tests

      - name: Unit tests
        run: PYTHONPATH=apps/api .venv/bin/python -m pytest tests/unit -q

  containers:
    name: integration, S3 compatibility and security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Bring up the isolated stack and run the suites
        run: scripts/test-integration.sh --unit

      - name: Leave no containers behind
        if: always()
        run: scripts/test-stack.sh down || true

  image:
    name: container build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the application image
        run: docker build -t s3vault:ci .

      - name: Smoke the image
        run: |
          docker run -d --name s3vault-smoke -p 3000:3000 \
            -e S3VAULT_ENV=development \
            -e PUBLIC_HOSTNAME=localhost \
            -e COOKIE_SECURE=false \
            -e DATABASE_URL=postgresql://x:x@127.0.0.1:5432/x \
            -e STORAGE_ENGINE_ENDPOINT=http://127.0.0.1:8333 \
            -e STORAGE_ROOT_ACCESS_KEY=ci-ak \
            -e STORAGE_ROOT_SECRET_KEY=ci-secret-key \
            -e KEK_BASE64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            s3vault:ci || true

          # The container is expected to exit non-zero because its dependencies
          # are absent. What matters is that it started, resolved its
          # configuration, and reached the database step rather than crashing
          # on an import or syntax error.
          sleep 5
          docker logs s3vault-smoke 2>&1 | tail -20
          docker rm -f s3vault-smoke || true

      - name: Build the Compose deployment
        env:
          PUBLIC_HOSTNAME: ci.local
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-dummy-password
          POSTGRES_DB: ci
          STORAGE_ROOT_ACCESS_KEY: ci-ak
          STORAGE_ROOT_SECRET_KEY: ci-dummy-secret
          KEK_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose config --quiet

  deployment-contract:
    name: compose contract
    runs-on: ubuntu-24.04
    env:
      # Render-only dummies so `docker compose config` can interpolate the
      # required variables in CI. Never used to start services.
      PUBLIC_HOSTNAME: ci.local
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-dummy-password
      POSTGRES_DB: ci
      STORAGE_ROOT_ACCESS_KEY: ci-ak
      STORAGE_ROOT_SECRET_KEY: ci-dummy-secret
      KEK_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: The engine and database must not be published to the host
        run: |
          config="$(docker compose config)"
          for service in seaweedfs postgres; do
            if echo "$config" | sed -n "/^  $service:/,/^  [a-z]/p" | grep -q 'published:'; then
              echo "::error::$service publishes a port to the host"
              exit 1
            fi
          done
          echo "engine and database are internal only"

      - name: Images are pinned, not floating
        run: |
          if docker compose config | grep -E 'image: .*:latest'; then
            echo "::error::a floating :latest tag is in use"
            exit 1
          fi
          echo "no floating tags"