name: Auto Fix Open PRs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to fix (optional)'
        required: false
        type: string

concurrency:
  group: auto-fix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege note: this workflow performs read-only validation only
# (it reports issues; it never creates, edits, or approves pull requests and
# never pushes). `contents: read` is therefore sufficient. No `pull-requests:`
# or `issues: write` permission is granted, and no write-capable secret is
# required. The GPG/POLIEDBC secrets formerly referenced here have been
# removed because no signing or push path exists in this workflow.
permissions:
  contents: read

jobs:
  auto-fix-prs:
    name: Auto-fix open PRs (read-only report)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch (read-only, no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.inputs.pr_number && format('refs/pull/{0}/merge', github.event.inputs.pr_number) || github.ref }}

      - name: Run auto-fix checks (read-only validation, no mutations)
        id: autofix
        run: |
          FIX_COUNT=0

          # Check for secret-bearing files (read-only, no modification)
          SECRET_FILES="$(git ls-files | grep -E '(^|/)(\\.env$|id_rsa|id_ed25519|.*\\.pem|.*\\.key)$' | grep -v '^\\.env\\.example$' || true)"
          if [ -n "$SECRET_FILES" ]; then
            echo "Found secret-bearing files: $SECRET_FILES"
            SECRET_COUNT=$(echo "$SECRET_FILES" | grep -c .)
            FIX_COUNT=$((FIX_COUNT + SECRET_COUNT))
          fi

          # Check for missing .gitignore (read-only)
          if [ ! -f .gitignore ]; then
            echo "Missing .gitignore"
            FIX_COUNT=$((FIX_COUNT + 1))
          fi

          echo "FIX_COUNT=$FIX_COUNT" >> $GITHUB_ENV
          echo "Issues found: $FIX_COUNT"

      - name: Report results
        run: |
          echo "Auto-fix completed. Issues found: ${FIX_COUNT:-0}"
          if [ "${FIX_COUNT:-0}" -gt 0 ]; then
            echo "## Auto-fix Results" >> $GITHUB_STEP_SUMMARY
            echo "- Issues found: ${FIX_COUNT}" >> $GITHUB_STEP_SUMMARY
            echo "- Repo: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
            echo "No signing or push path exists in this workflow; findings are reported for manual review." >> $GITHUB_STEP_SUMMARY
          fi
