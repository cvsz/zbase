[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    integration: requires the PostgreSQL + SeaweedFS stack (scripts/test-stack.sh)
    security: security-focused assertions
    s3compat: S3 protocol compatibility
filterwarnings =
    error::DeprecationWarning:s3vault.*