# S3Vault reverse proxy.
#
# Responsibilities:
#   - terminate TLS and redirect plaintext to HTTPS
#   - stream large uploads without buffering them to disk
#   - allow the long request times that multipart uploads need
#   - never expose the storage engine or PostgreSQL

upstream s3vault_api {
    server api:3000;
    keepalive 32;
}

# Requests larger than this are buffered by nginx. S3Vault's own body limit is
# REQUEST_BODY_LIMIT_BYTES; this is set higher so the API can answer with a
# structured 413 instead of nginx truncating first.
client_max_body_size 512m;
proxy_request_buffering off;   # stream request bodies straight through
proxy_buffering off;           # stream responses straight through

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME HTTP-01 must stay reachable over plaintext.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Large multipart uploads need long read/write windows.
    proxy_connect_timeout 15s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        proxy_pass http://s3vault_api;
    }

    location / {
        proxy_pass http://s3vault_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}