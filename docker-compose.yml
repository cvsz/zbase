# S3Vault single-host deployment.
#
# Only the reverse proxy publishes ports. PostgreSQL, SeaweedFS and the API
# live on an internal network and are unreachable from the host's public
# interfaces. See docs/INSTALLATION.md and docs/SECURITY.md#firewall.
#
# Images are pinned to immutable digests. Update them deliberately with
# scripts/update-images.sh, never automatically.

name: s3vault

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  proxy:
    image: nginx:1.27.4-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${S3VAULT_HTTP_PORT:-80}:80"
      - "${S3VAULT_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/proxy/certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot:ro
    networks: [edge, internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE", "CHOWN", "SETGID", "SETUID"]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      S3VAULT_ENV: production
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME must be set}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      STORAGE_ENGINE: seaweedfs
      STORAGE_ENGINE_ENDPOINT: http://seaweedfs:8333
      STORAGE_ROOT_ACCESS_KEY: ${STORAGE_ROOT_ACCESS_KEY:?}
      STORAGE_ROOT_SECRET_KEY: ${STORAGE_ROOT_SECRET_KEY:?}
      STORAGE_ADDRESSING_STYLE: ${STORAGE_ADDRESSING_STYLE:-path}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      KEK_BASE64: ${KEK_BASE64:?}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      S3VAULT_REQUIRE_DRY_RUN: ${S3VAULT_REQUIRE_DRY_RUN:-0}
      S3VAULT_REQUIRE_BACKUP: ${S3VAULT_REQUIRE_BACKUP:-0}
      S3VAULT_ALLOW_PRODUCTION_CHANGES: ${S3VAULT_ALLOW_PRODUCTION_CHANGES:-0}
      S3VAULT_BACKUP_DIR: ${S3VAULT_BACKUP_DIR:-/backups}
      S3VAULT_BACKUP_RETENTION_DAYS: ${S3VAULT_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - s3vault_backups:/backups
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    stop_grace_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    command: ["python", "/app/apps/worker/worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      S3VAULT_ENV: production
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      STORAGE_ENGINE: seaweedfs
      STORAGE_ENGINE_ENDPOINT: http://seaweedfs:8333
      STORAGE_ROOT_ACCESS_KEY: ${STORAGE_ROOT_ACCESS_KEY:?}
      STORAGE_ROOT_SECRET_KEY: ${STORAGE_ROOT_SECRET_KEY:?}
      KEK_BASE64: ${KEK_BASE64:?}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - s3vault_backups:/backups
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    stop_grace_period: 30s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      # Postgres 18 requires the mount at /var/lib/postgresql, not .../data.
      - s3vault_pgdata:/var/lib/postgresql
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    logging: *default-logging
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.allowEmptyFolder=true
      - -ip=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ROOT_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_ROOT_SECRET_KEY:?}
    volumes:
      - s3vault_swdata:/data
    # Deliberately no published ports: the engine is reachable only on the
    # internal network. Its admin UI (9333) is not exposed at all.
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  certbot:
    image: certbot/certbot:4.1.0
    restart: unless-stopped
    logging: *default-logging
    profiles: ["tls"]
    volumes:
      - ./infra/proxy/certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks: [edge]
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  # edge: the only network reachable from the host's published ports.
  edge:
  # internal: not attached to the host's default bridge reachability.
  internal:
    internal: true

volumes:
  s3vault_pgdata:
  s3vault_swdata:
  s3vault_backups:
  certbot_webroot: